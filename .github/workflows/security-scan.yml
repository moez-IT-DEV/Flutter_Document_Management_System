      # 1. فحص حاجب: يفشل البناء عند وجود ثغرات CRITICAL أو HIGH
      - name: Trivy (Blocking Gate)
        uses: aquasecurity/trivy-action@0.36.0  # استخدم commit SHA بدلاً من tag
        with:
          image-ref: 'flutter-dms:scan'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'          # 🔴 هذا هو التغيير الجوهري
          ignore-unfixed: true    # تجاهل الثغرات التي لا يوجد لها إصلاح
          format: 'table'

      # 2. فحص غير حاجب: يرفع SARIF إلى Security tab للرؤية
      - name: Trivy (SARIF Report)
        uses: aquasecurity/trivy-action@0.36.0
        if: always()
        with:
          image-ref: 'flutter-dms:scan'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.39.0
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
