name: CD - Build & Push to GHCR + Docker Hub + Deploy to K8s

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set lowercase repository name for GHCR
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set image tags
        run: |
          echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV
          echo "IMAGE_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Build and push to both registries
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:${{ env.IMAGE_VERSION }}
            ghcr.io/${{ env.REPO_LOWER }}:${{ env.IMAGE_VERSION }}-${{ env.SHORT_SHA }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/flutter-dms:${{ env.IMAGE_VERSION }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/flutter-dms:${{ env.IMAGE_VERSION }}-${{ env.SHORT_SHA }}

      # ========================================
      # ✅ الخطوات الجديدة: النشر إلى Kubernetes
      # ========================================
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          IMAGE="ghcr.io/${{ env.REPO_LOWER }}:${{ env.IMAGE_VERSION }}"
          NAMESPACE="prod"
          
          echo "🚀 Deploying $IMAGE to namespace: $NAMESPACE"
          
          # تأكد من وجود namespace
          kubectl get namespace $NAMESPACE || kubectl create namespace $NAMESPACE
          
          # تحديث الصورة في Deployment
          kubectl set image deployment/flutter-dms-web \
            web=$IMAGE \
            -n $NAMESPACE
          
          # انتظار انتهاء الـ Rollout
          kubectl rollout status deployment/flutter-dms-web \
            -n $NAMESPACE --timeout=5m
          
          # عرض الحالة النهائية
          echo "📦 Current Pods:"
          kubectl get pods -n $NAMESPACE
          
          echo "✅ Deployment complete!"

      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ghcr.io/${{ env.REPO_LOWER }}:${{ env.IMAGE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
