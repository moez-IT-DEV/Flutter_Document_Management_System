name: CD - Build & Deploy to Local K8s

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          echo "=== User Info ==="
          whoami
          echo "HOME=$HOME"
          echo "=== Minikube ==="
          minikube status || true
          echo "=== kubectl ==="
          kubectl get nodes || true
          echo "=== Docker ==="
          docker ps | head -3

      - name: Verify kubectl access
        run: |
          ls -la $HOME/.kube/config
          kubectl cluster-info
          kubectl get nodes

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & Push Docker Images
        run: |
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          IMAGE_GHCR="ghcr.io/${REPO_LOWER}:${{ github.run_number }}"
          IMAGE_HUB="moezdocker/flutter-dms:${{ github.run_number }}"
          IMAGE_HUB_LATEST="moezdocker/flutter-dms:latest"
          
          echo "🐳 Building: $IMAGE_HUB"
          docker build -t $IMAGE_GHCR -t $IMAGE_HUB -t $IMAGE_HUB_LATEST .
          
          docker push $IMAGE_GHCR
          docker push $IMAGE_HUB
          docker push $IMAGE_HUB_LATEST
          
          echo "IMAGE_HUB=$IMAGE_HUB" >> $GITHUB_ENV
          echo "✅ Images pushed"

      - name: Load image to Minikube
        run: |
          echo "📥 Loading image into Minikube: $IMAGE_HUB"
          
          if docker exec minikube sh -c 'command -v ctr' > /dev/null 2>&1; then
            docker save $IMAGE_HUB | docker exec -i minikube ctr -n k8s.io images import -
            echo "✅ Loaded via containerd"
          fi

      - name: Deploy to Kubernetes
        run: |
          echo "🚀 Deploying $IMAGE_HUB to prod..."
          
          kubectl set image deployment/flutter-dms-web \
            web=$IMAGE_HUB \
            -n prod
          
          kubectl rollout status deployment/flutter-dms-web \
            -n prod --timeout=5m
          
          echo "📦 Current Pods:"
          kubectl get pods -n prod
          
          echo "✅ Deployment complete!"

      - name: Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: moezdocker/flutter-dms:${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: solve-node" >> $GITHUB_STEP_SUMMARY
